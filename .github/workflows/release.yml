name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          changelog = Path("CHANGELOG.md")
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          notes = []
          collecting = False
          if changelog.is_file():
              for line in changelog.read_text().splitlines():
                  heading = re.match(r"^##\s+(.+)$", line)
                  if heading:
                      if collecting:
                          break
                      title = heading.group(1)
                      collecting = bool(re.match(
                          r"^\[?v?" + re.escape(version) + r"(?:\]|\s|$)", title
                      ))
                  elif collecting:
                      notes.append(line)
          Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(
              "\n".join(notes).strip()
          )
          PY
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -s "$RUNNER_TEMP/release-notes.md" ]; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
