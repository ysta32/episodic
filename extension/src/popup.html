<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Episodic Scrobbler</title>
    <style>
      :root { color-scheme: dark; font: 14px system-ui, sans-serif; background: #0b0b10; color: #ececf1; }
      body { width: 330px; margin: 0; padding: 20px; }
      h1 { font-size: 21px; margin-top: 0; } h2 { font-size: 16px; }
      form, li { background: #15151d; border: 1px solid #262633; border-radius: 16px; padding: 12px; }
      label { display: block; margin-bottom: 12px; }
      input[type=url] { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 8px; background: #0b0b10; color: inherit; border: 1px solid #9a9aad; border-radius: 6px; }
      button { padding: 8px 12px; border: 0; border-radius: 8px; background: #ff5d73; color: #0b0b10; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: .5; cursor: wait; }
      #sync { margin-top: 12px; } p, small { color: #9a9aad; } #status { min-height: 2em; }
      ul { list-style: none; padding: 0; } li { margin: 8px 0; overflow-wrap: anywhere; } small { display: block; margin-top: 4px; }
    </style>
  </head>
  <body>
    <h1>Episodic Scrobbler</h1>
    <form id="settings">
      <label><input id="enabled" type="checkbox"> Auto-scrobble at 90%</label>
      <label>App origin <input id="app-url" type="url" required></label>
      <button type="submit">Save settings</button>
    </form>
    <button id="sync" type="button">Sync now</button>
    <p id="status" role="status" aria-live="polite"></p>
    <h2>Recent scrobbles</h2>
    <ul id="recent"></ul>
    <p>Sync opens background receiver tabs. “Receiver opened” does not confirm that the app saved the watch.</p>
    <script src="popup.js" type="module"></script>
  </body>
</html>
